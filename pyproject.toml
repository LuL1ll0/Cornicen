[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cornicen"
version = "0.1.4"
description = "Local vulnerability matching and durable alerts"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
cornicen = "cornicen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cornicen = ["data/*.toml"]
