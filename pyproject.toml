[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cornicen"
version = "0.1.8"
description = "Self-hosted CVE alerter for homelabs: matches CVE List, KEV and EPSS locally and alerts via ntfy."
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
cornicen = "cornicen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cornicen = ["data/*.toml"]
